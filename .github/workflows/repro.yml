name: repro

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  correlated-scalar:
    name: correlated scalar SUM
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start RisingWave (compose / playground-style single_node)
        run: docker compose up -d --wait risingwave

      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Wait for SQL
        env:
          PGHOST: 127.0.0.1
          PGPORT: "4566"
          PGDATABASE: dev
          PGUSER: root
        run: bash scripts/wait-for-rw.sh

      - name: Run repro
        env:
          PGHOST: 127.0.0.1
          PGPORT: "4566"
          PGDATABASE: dev
          PGUSER: root
        run: bash scripts/run-repro.sh

      - name: RisingWave logs
        if: failure()
        run: docker compose logs --no-color risingwave
